name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # setup-python may not offer 3.9 for the Apple Silicon runner; Linux and Windows still cover 3.9
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -v
      - name: Check that Windows can set "Date created"
        if: runner.os == 'Windows'
        run: python tools/check_windows_creation_time.py

  interop:
    name: Cross-check against Pillow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (test-only, never needed to run the program)
        run: python -m pip install pillow
      - name: Run the interoperability tests
        run: python -m unittest tests.test_interop -v

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run the console command
        run: |
          python -m pip install .
          photo-organizer --version
