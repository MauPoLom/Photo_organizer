; Photo Organizer configuration (example)
; Copy this file to config.ini and edit it: python photo_organizer.py --config config.ini
; Paths can be absolute or relative to this configuration file.
; Use forward slashes on all operating systems, or normal native paths.
; Put comments on their own line (a ';' after a value becomes part of the value).
;
; This version supports ONLY: .jpg .jpeg .png .bmp .heic .heif (no videos, except .mp4 and .mov when handle_movies = yes).
; It needs NO extra Python packages. See README.md, section Requirements.

[folders]
; Folder with the photos to sort. It must exist and is only read (and, in move mode, emptied).
input_folder = ./photos_input
; Where the sorted photos go. Created when needed. Must not be inside the input folder.
output_folder = ./photos_sorted

[organization]
; Folder layout below the output folder. Allowed:
;   YYYY             -> 2024
;   YYYY_MM          -> 2024_07
;   YYYY/MM          -> 2024/07
;   YYYY/YYYY-MM     -> 2024/2024-07
;   YYYY/MM/DD       -> 2024/07/15
output_folderstructure = YYYY_MM
; Name of the folder for files without any usable date (see [dates]).
unknown_date_folder = unknown_date
; yes: also sort movies (.mp4 and .mov) into a sub-folder of their date folder, for example 2019_07/movies.
; Movies carry no EXIF, so their date comes from the file name, then the file modification time (see [dates]).
; no (default): movies are left alone and listed in unknown_files.csv.
handle_movies = no
; Name of that sub-folder (a simple name, no slashes). It is added to every output_folderstructure:
; 2019_07/movies, 2019/07/movies, 2019/07/04/movies. Movies without any date go to unknown_date/movies.
movies_folder = movies
; yes: only write the CSV reports, do not create output folders or change photos.
testrun = yes
; yes: copy (default), no: move safely (copy, verify, then delete original).
copy_mode = yes
; yes: set the destination file's modification time to the EXIF capture time
; (DateTimeOriginal or DateTimeDigitized). Other date sources never change times.
; This sets the modification time only; see set_creation_time for "Date created".
change_timestamp = no
; yes (Windows only): also set the copy's "Date created" to the same capture time.
; Requires change_timestamp = yes. On other systems this is ignored with a warning.
; If it fails on a file (for example on some network shares) the file is still
; copied and the CSV details column says why the creation time was not set.
set_creation_time = no
; yes: SHA-256 verify the copy before calling a transfer successful.
; On a move, a mismatch will NEVER cause the source to be deleted.
verify = yes
; Rename files by their capture date. Empty = keep the original file name.
; Uses strftime codes plus {original} for the old name without extension.
; Examples:  %Y%m%d_%H%M%S             -> 20190704_153012.jpg
;            %Y-%m-%d_%H%M%S_{original} -> 2019-07-04_153012_IMG_0042.jpg
; Only files whose date is a real capture time (EXIF, or a filename that
; contains date AND time) are renamed; all others keep their name.
rename_by_date =
; yes: after a MOVE, remove input sub-folders that became empty because of
; this run. The input folder itself is never removed. Not simulated in a test run.
cleanup_empty_folders = no

[dates]
; Date priority:
;   1. EXIF DateTimeOriginal   2. EXIF DateTimeDigitized
;   3. date in the file name (if enabled)
;   4. EXIF DateTime = last edit time (if enabled)
;   5. file modification time (if enabled)
;   otherwise the file goes to the unknown_date folder.
use_filename_date = yes
; EXIF DateTime is usually the time of the last edit, not of the shot.
use_exif_modify_date = no
; no: files without any other date go to the unknown_date folder instead.
use_filesystem_mtime = yes
; Which time is used for folder and file names when the EXIF data records a UTC offset:
;   wallclock: the time shown by the camera (default)
;   local:     converted to this computer's timezone
;   utc:       converted to UTC
; Times without a recorded offset are always used as-is.
timezone_mode = wallclock
; Dates before this year are rejected as a reset camera clock (1970, 1980 ...).
min_year = 1990
; yes: dates later than tomorrow are rejected.
reject_future_dates = yes

[behavior]
; yes: recursively scan subfolders.
recursive = yes
; Allowed: skip_identical, rename.
; skip_identical: a file whose content already exists ANYWHERE in the output
;   folder (under any name) is not copied again. Different files with the same
;   name are renamed NAME_001, NAME_002 ...
; rename: never compare content; same names become NAME_001, NAME_002 ...
duplicate_policy = skip_identical
; yes: skip hidden files and folders: names starting with a period everywhere,
; plus the Windows hidden/system attribute and the macOS hidden flag.
skip_hidden = yes
; File types to include (case insensitive). Only these six are supported.
extensions = .jpg,.jpeg,.png,.bmp,.heic,.heif
; Folder for the two CSV reports below. Relative: next to this config file. Created when needed.
; Use . to put the reports right next to config.ini. Not inside the input folder.
reports_folder = ./reports
; Name of the report of every file, written in the reports folder, also in a test run. Overwritten each run.
; (An absolute path here ignores reports_folder.)
report_csv = organizer_report.csv
; yes: skipped files (type, symlink, hidden) get a row in the CSV and are counted.
report_skipped = yes
; Name of the list of unsupported files, also in the reports folder. Written (and a warning printed) only when there are some.
unknown_files_csv = unknown_files.csv
